[package]
name = "codex-assistant"
version = "0.1.0"
description = "Codex 风格的桌面 AI 助手"
edition = "2021"

[lib]
name = "codex_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
